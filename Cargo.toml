[package]
name = "toktoktok"
version = "1.0.0"
edition = "2021"
description = "High-performance BPE tokenizer trainer compatible with tiktoken"
authors = ["Liquid AI"]
license = "Apache-2.0"
repository = "https://github.com/Liquid4All/toktoktok"
readme = "README.md"

[dependencies]
# CLI and configuration
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Parallelism
rayon = "1.8"
crossbeam = "0.8"

# Regex for pre-tokenization (standard regex - much faster than fancy-regex)
regex = "1.10"

# File formats
parquet = { version = "53.0", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
arrow = { version = "53.0", default-features = false }

# Utilities
base64 = "0.22"
rand = "0.8"
rand_xoshiro = "0.6"
ahash = "0.8"
memmap2 = "0.9"
walkdir = "2.4"
indicatif = { version = "0.17", features = ["rayon"] }
num_cpus = "1.16"
bytemuck = { version = "1.14", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 4
